<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Инструкции по сборке мебели</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <h1>Инструкции по сборке</h1>
    <p class="muted">Отсканируйте QR-код на упаковке или детали либо выберите изделие ниже.</p>
  </header>

  <main class="container">
    <div id="orders"></div>
    <p id="list-error" class="error" hidden></p>

    <div class="block no-print">
      <h2>Для упаковщика и конструктора</h2>
      <ul class="hw-list">
        <li><a href="packing.html">Упаковка и загрузка контейнера</a></li>
        <li><a href="qr.html">Печать этикеток (деталь, упаковка)</a></li>
      </ul>
      <p class="muted">Открыть свой файл модели (JSON) без загрузки на сайт — просмотр только на этом устройстве.</p>
      <label class="btn btn-ghost file-btn">Открыть файл модели
        <input type="file" id="file" accept="application/json,.json" hidden>
      </label>
    </div>
  </main>

  <script src="assets/core.js"></script>
  <script>
    const { esc, loadOrder, loadModel, expected, loadShipment, modelUrl } = AsmCore;
    const root = document.getElementById("orders");

    function status(order, item, model, ship) {
      const need = AsmCore.expected(order, item, model).map(e => e.code);
      const have = new Set(ship.packages.filter(p => p.item === item.id).flatMap(p => p.codes));
      const n = need.filter(c => have.has(c)).length;
      const cls = n === need.length ? "ok" : n ? "warn" : "";
      return `<span class="badge ${cls}">упаковано ${n} из ${need.length}</span>`;
    }

    fetch("data/orders/index.json").then(r => r.json()).then(list => Promise.all(list.map(o => render(o.id))))
      .catch(err => {
        const e = document.getElementById("list-error");
        e.hidden = false;
        e.textContent = "Не удалось загрузить список заказов.";
      });

    function render(id) {
      return Promise.all([loadOrder(id), loadShipment(id)]).then(([order, ship]) => {
        return Promise.all(order.items.map(i => loadModel(i.model))).then(models => {
          const byItem = {};
          order.items.forEach((i, k) => { byItem[i.id] = models[k]; });
          const html = [`<h2>${esc(order.title)} ${order.demo ? '<span class="demo-tag">демо-данные</span>' : ""}</h2>`];
          if (order.note) html.push(`<p class="muted">${esc(order.note)}</p>`);
          order.floors.forEach(f => {
            html.push(`<p class="floor">Этаж ${f.n}</p>`);
            f.rooms.forEach(r => {
              html.push(`<p class="room">${esc(r.name)}</p><ul class="kit-list">`);
              r.items.forEach(raw => {
                const it = order.items.find(x => x.id === raw.id);
                const m = byItem[it.id];
                html.push(`<li class="card"><a href="${modelUrl(order, it)}"><span class="item-row"><span><span class="code">${esc(it.code)}</span> · ${esc(m.name)}</span>${status(order, it, m, ship)}</span><span class="muted">Открыть инструкцию →</span></a></li>`);
              });
              html.push("</ul>");
            });
          });
          root.insertAdjacentHTML("beforeend", html.join(""));
        });
      });
    }

    document.getElementById("file").addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      f.text().then(t => {
        JSON.parse(t); // проверка, что это JSON
        try { sessionStorage.setItem("localModel", t); } catch (err) { return alert("Файл слишком большой для просмотра."); }
        location.href = "model.html?local=1";
      }).catch(() => alert("Это не корректный файл модели (JSON)."));
    });
  </script>
</body>
</html>
