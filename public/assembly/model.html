<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сборка изделия</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="back">← Все изделия</a>
    <p class="where" id="m-where" hidden></p>
    <h1 id="m-name">Загрузка…</h1>
    <p class="muted" id="m-meta"></p>
    <button id="btn-pdf" class="btn btn-ghost" type="button" hidden>Сохранить PDF</button>
  </header>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="assembly" class="is-active" type="button">Сборка</button>
    <button data-tab="view3d" type="button">3D</button>
    <button data-tab="part" type="button" id="tab-btn-part" hidden>Деталь</button>
    <button data-tab="spec" type="button">Состав</button>
    <button data-tab="draw" type="button">Чертежи</button>
  </nav>

  <main class="container" id="main">
    <p id="m-error" class="error" hidden></p>

    <section id="tab-assembly" class="tab is-active">
      <div class="viewer" id="viewer-asm"></div>
      <div class="controls-row">
        <button id="asm-play" class="btn btn-ghost" type="button">▶ Анимация сборки</button>
        <label class="inline">Скорость
          <select id="asm-speed">
            <option value="0.5">0,5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1,5×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
          </select>
        </label>
      </div>
      <div class="progress"><div class="bar" id="asm-bar"></div></div>
      <div class="step-panel">
        <p class="muted" id="asm-where"></p>
        <h2 id="asm-title"></h2>
        <p id="asm-text"></p>
        <div id="asm-parts" class="chips"></div>
        <ul id="asm-hw" class="hw-list"></ul>
        <p id="asm-tool" class="note" hidden></p>
        <p id="asm-check" class="note" hidden></p>
        <p id="asm-warn" class="note warn" hidden></p>
        <div class="nav-row">
          <button id="asm-prev" class="btn btn-ghost" type="button">← Назад</button>
          <button id="asm-next" class="btn" type="button">Далее →</button>
        </div>
        <div id="asm-dots" class="dots"></div>
      </div>
    </section>

    <section id="tab-view3d" class="tab">
      <div class="viewer" id="viewer-3d"></div>
      <div class="toolbar" id="toolbar">
        <button type="button" data-mode="parts" class="is-on">Детали</button>
        <button type="button" data-mode="blocks">Модули</button>
        <button type="button" data-toggle="facades">Скрыть фасады</button>
        <button type="button" data-toggle="transparent">Прозрачно</button>
        <button type="button" data-toggle="dims">Размеры</button>
        <button type="button" data-toggle="holes">Крепёж и сверление</button>
        <button type="button" data-toggle="edges">Кромка</button>
        <button type="button" data-toggle="ruler">Рулетка</button>
        <button type="button" id="btn-reset">Сбросить</button>
      </div>
      <label class="range">Раздвинуть детали <input type="range" id="explode" min="0" max="100" value="0"></label>
      <div class="block" id="pick-info"><p class="muted">Коснитесь детали, чтобы увидеть её размеры.</p></div>
      <div class="block" id="tree-box">
        <h3>Состав изделия</h3>
        <div id="tree"></div>
      </div>
    </section>

    <section id="tab-part" class="tab">
      <div class="viewer" id="viewer-part"></div>
      <div id="part-card"></div>
    </section>

    <section id="tab-spec" class="tab"></section>
    <section id="tab-draw" class="tab"></section>
  </main>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/viewer3d.js"></script>
  <script src="assets/drawings.js"></script>
  <script src="assets/model.js"></script>
</body>
</html>
